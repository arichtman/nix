---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctest-6
  namespace: lb-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: ctest-6 }
  template:
    metadata:
      labels: { app: ctest-6 }
    spec:
      containers:
        - name: ctest
          image: docker.io/ealen/echo-server:latest
          ports: [{ containerPort: 80 }]
          env:
          - name: MY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
      topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: ctest-6
            # matchLabelKeys:
            #   - app
---
apiVersion: v1
kind: Service
metadata:
  name: ctest-6
  namespace: lb-test
spec:
  type: LoadBalancer
  # Need this or else every node will advertise the VIP over BGP, even when they have no local backend.
  # You do *not* want to set internalTrafficPolicy also as it'll just dead-end when no local backend.
  externalTrafficPolicy: Local
  selector: { app: ctest-6 }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ctest-6-internal
  namespace: lb-test
spec:
  type: ClusterIP
  selector: { app: ctest-6 }
  ports:
    - port: 80
      targetPort: 80
