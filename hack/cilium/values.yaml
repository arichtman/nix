cluster:
  name: k8s-richtman-au
# No kube-proxy
kubeProxyReplacement: true
# Enables healthz endpoint
kubeProxyReplacementHealthzBindAddr: "[::]:10256"
# Required to bypass the non-working default APIserver service without kube-proxy
k8sServiceHost: fat-controller.systems.richtman.au
k8sServicePort: 6443
# Set our networking stack
ipv4:
  enabled: false
ipv6:
  enabled: true

# Testing, want to make sure it's working as intended
enableXTSocketFallback: false

# Enable BGP to advertise our ranges and VIPs
bgpControlPlane:
  enabled: true

# Enable gateway API
gatewayAPI:
  enabled: true
# Trying to get rid of tunneling
routingMode: native
nativeRoutingCIDRFromClusterPool: true
monitor:
  enabled: true
# BGP sends the routes up for N-S, but for E-W we still need routes for cluster traffic.
#   and since we're not peering *between* the nodes - this setting.
autoDirectNodeRoutes: true
directRoutingSkipUnreachable: true # Cannot have this without autoDirectNodeRoutes

# I think this is for outside-of-cluster, local traffic to not have to go via the router.
l2NeighDiscovery:
  enabled: true

# Testing if this fixes ClusterIP
# Ref: https://github.com/cilium/cilium/issues/34543#issuecomment-2314871781
# endpointRoutes:
#   enabled: true

bpf:
  masquerade: true
  # Note: netkit incompatible and in beta but required for gateway API
  tproxy: true

ipam:
  operator:
    clusterPoolIPv6PodCIDRList: ["fda6:3c52:d12b:1::/64"]
    # Unable to init cluster-pool allocator" error="unable to initialize IPv6 allocator: New CIDR set failed; the node CIDR size is too big" subsys=cilium-operator-generic
    # Ref: https://github.com/cilium/cilium/issues/20756#issuecomment-2450328186
    clusterPoolIPv6MaskSize: 80

# -- Roll out cilium agent pods automatically when configmap is updated.
rollOutCiliumPods: true

operator:
  rollOutPods: true # Should update when configMap changes, not sure if they hot-reload anyway
  # Set to one for ease of log inspection
  replicas: 2

hubble:
  # Failed to create peer notify client for peers change notification
  # Ref: https://github.com/cilium/cilium/issues/20130#issuecomment-1267605959
  peerService:
    clusterDomain: cluster.local
  # This will allow use of user-namespaces for hubble components.
  # Not all clusters support user-namespaces.
  # See: https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/
  hostUsers: true
  relay:
    enabled: true
    rollOutPods: true
    # tls: {}
  ui:
    enabled: true
    rollOutPods: true

# Ensure we have no hangovers when re-rolling the install
cleanState: true

# This makes kubectl logs and execs default nicely
podAnnotations:
  kubectl.kubernetes.io/default-container: cilium-agent
