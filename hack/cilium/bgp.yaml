apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  # Node pod ranges are automatically added to the routing table by autoDirectNodeRoutes,
  #   so no need to peer every node.
  # There's no workloads to reach on the control node, usually.
  # TODO: Swap to nodeAffinity so we can use notIn and just exclude control
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: worker
  bgpInstances:
  - name: "k8s.richtman.au"
    localASN: 64512
    peers:
    - name: opnsense
      peerASN: 64512
      # Not allowed DNS names on the CRD,
      #   can't use link-local either
      #   (probably due to ambiguity of interface),
      #   which would have avoided public prefix dependency.
      # So, LAN ULA address to indirect from public prefix.
      # Ref: https://docs.cilium.io/en/stable/network/bgp-control-plane/bgp-control-plane-configuration/#bgp-cluster-configuration
      peerAddress: 'fd2f:f92f:f268::1'
      peerConfigRef:
        name: opnsense
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: opnsense
spec:
  gracefulRestart:
    enabled: true
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          bgp.cilium.k8s.richtman.au/advertise: "true"
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: cluster-external
  labels:
    bgp.cilium.k8s.richtman.au/advertise: "true"
spec:
  advertisements:
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
          # API server on host networking sends packets to default gateway,
          #   which needs to know how to route something outside LAN to the nodes inside it.
          # TODO: confirm
          - ClusterIP
      # *** REQUIRED OR NOTHING GETS ADVERTISED ***
      selector:
        matchExpressions:
        - {key: somekey, operator: NotIn, values: ['never-used-value']}
---
# No private-only ULA services for now...
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-subnet
spec:
  blocks:
    # Need to avoid overlap cause initial IPAM is well-known and sits in the bottom of the range
    # If we can swap out the allocator for (pseudo)random we can maybe flatten it to the LAN subnet
    - cidr: 2403:581e:ab78:ffff::/64
