# Ref: https://github.com/coredns/helm/tree/master/charts/coredns#configuration
service:
  # Need a pre-shared/well-known IP since kubelet config has to have the DNS server IP
  clusterIP: fda6:3c52:d12b::10
serviceAccount:
  create: true
replicaCount: 2
